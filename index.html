<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Acx</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    /* Background is plain blue for now (stands in for the photo) */
    background: #2b4a8b;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto,
      Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .avatar {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: #000;
    flex-shrink: 0;
  }

  .info {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .name {
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .name .bow {
    font-size: 12px;
  }

  .tagline {
    color: #e8e8e8;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .tagline .x-mark {
    width: 14px;
    height: 14px;
  }

  .meta {
    display: flex;
    gap: 34px;
    color: #b7bcc4;
    font-size: 10.5px;
  }

  .links {
    display: flex;
    gap: 22px;
    margin-top: 4px;
  }

  .links a {
    color: #d6d9de;
    text-decoration: none;
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: color 0.15s ease;
  }

  .links a:hover {
    color: #fff;
  }

  .links svg {
    width: 11px;
    height: 11px;
    fill: currentColor;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .overlay.open {
    display: flex;
  }

  .soon-box {
    background: #1f3a72;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    padding: 28px 40px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
</style>
</head>
